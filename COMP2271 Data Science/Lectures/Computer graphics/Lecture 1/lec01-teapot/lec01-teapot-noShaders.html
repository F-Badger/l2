<!DOCTYPE html>
<html>
<head>
    <title>Hello World: Teapot (Built-in Material)</title>
    <style>body { margin: 0; }</style>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      { "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      } }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TeapotGeometry } from 'three/addons/geometries/TeapotGeometry.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(3, 3, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        new OrbitControls(camera, renderer.domElement);

        // 2. Lighting (Essential for Smooth Shading)
        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(5, 10, 7);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040)); // Soft fill light

        // 3. Object Creation (The Abstraction)
        const geometry = new TeapotGeometry(1, 10); // 10 segments = smooth
        
        // MeshPhongMaterial calculates light interaction automatically 
        const material = new THREE.MeshPhongMaterial({ 
            color: 0x00ff00, 
            shininess: 100 
        });
        
        const teapot = new THREE.Mesh(geometry, material);
        scene.add(teapot);

        // 4. Render Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
